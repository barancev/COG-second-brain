<svg xmlns="http://www.w3.org/2000/svg" width="634" height="640" viewBox="0 0 634 640" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="634" height="640" fill="#ffffff"/>
  <text x="50" y="28" font-size="16" font-weight="700" fill="#1a1a19">Раскрой листа фанеры 8 мм · 1525×1525 → 4 полки 900×400</text>
  <text x="50" y="46" font-size="12" fill="#6b6b68">Зелёное — полки (4 шт.), серое — отходы. Размеры в мм.</text>

  <!-- Полки -->
  <g stroke="#2e7d32" stroke-width="1.5">
    <rect x="50"  y="60"  width="140"    height="315"    fill="#cfe8d4"/>
    <rect x="190" y="60"  width="140"    height="315"    fill="#cfe8d4"/>
    <rect x="330" y="60"  width="140"    height="315"    fill="#cfe8d4"/>
    <rect x="50"  y="375" width="315"    height="140"    fill="#cfe8d4"/>
  </g>

  <!-- Отходы -->
  <g stroke="#b0aea8" stroke-width="1.5">
    <rect x="470" y="60"  width="113.75" height="315"    fill="#eceae6"/>
    <rect x="50"  y="515" width="315"    height="78.75"  fill="#eceae6"/>
    <rect x="365" y="375" width="218.75" height="218.75" fill="#eceae6"/>
  </g>

  <!-- Контур листа -->
  <rect x="50" y="60" width="533.75" height="533.75" fill="none" stroke="#1a1a19" stroke-width="2"/>

  <!-- Подписи полок -->
  <g font-size="12" fill="#1a4d2a" text-anchor="middle">
    <text x="120" y="222">полка</text><text x="120" y="238">400×900</text>
    <text x="260" y="222">полка</text><text x="260" y="238">400×900</text>
    <text x="400" y="222">полка</text><text x="400" y="238">400×900</text>
    <text x="207" y="449">полка 900×400</text>
  </g>

  <!-- Подписи отходов -->
  <g font-size="11" fill="#8a8a86" text-anchor="middle">
    <text x="526" y="214">отход</text><text x="526" y="229">325×900</text>
    <text x="207" y="558">отход 900×225</text>
    <text x="474" y="481">отход</text><text x="474" y="496">625×625</text>
  </g>

  <!-- Габарит 1525 сверху -->
  <g font-size="11" fill="#6b6b68" text-anchor="middle">
    <text x="316" y="612">1525</text>
  </g>
  <!-- Габарит 1525 слева -->
  <g font-size="11" fill="#6b6b68" text-anchor="middle">
    <text x="24" y="330" transform="rotate(-90 24 330)">1525</text>
  </g>
</svg>
